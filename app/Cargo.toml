[package]
name = "cupertino-settings"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
chrono = { version = "0.4", default-features = false }
serde_json = "1.0"
sunrise = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
md5 = "0.8"
png = "0.18"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
lto = true
strip = true
